name: Get Citation Data

on:
  # Allow manual execution from the Actions page
  workflow_dispatch:

  # Run automatically every day at 08:00 UTC
  schedule:
    - cron: "0 8 * * *"

  # Optional: run after GitHub Pages is built
  page_build:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Prevent the crawler from hanging for hours
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        working-directory: ./google_scholar_crawler
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch Google Scholar citation data
        working-directory: ./google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          timeout 5m python main.py

      - name: Push citation data to google-scholar-stats branch
        working-directory: ./google_scholar_crawler/results
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add *.json
          git commit -m "Update Google Scholar citation data"

          git branch -M google-scholar-stats

          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git push origin google-scholar-stats --force
